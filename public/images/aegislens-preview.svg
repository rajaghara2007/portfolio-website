<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <g opacity="0.15">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" stroke="#38bdf8" stroke-width="1" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" stroke="#38bdf8" stroke-width="1" />
  </g>
  <rect x="50" y="40" width="700" height="420" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="url(#shieldGrad)" stroke-width="2" />
  <circle cx="80" cy="70" r="6" fill="#ef4444" />
  <circle cx="100" cy="70" r="6" fill="#f59e0b" />
  <circle cx="120" cy="70" r="6" fill="#10b981" />
  <text x="400" y="75" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">aegis-lens.vercel.app</text>
  <g transform="translate(400, 240)">
    <path d="M0 -70 L60 -35 L60 35 L0 70 L-60 35 L-60 -35 Z" fill="#1e293b" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow)" />
    <circle cx="0" cy="0" r="24" fill="#030712" stroke="#38bdf8" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#00f5ff" filter="url(#glow)" />
  </g>
  <text x="400" y="360" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" text-anchor="middle">AEGISLENS PLATFORM</text>
  <text x="400" y="390" fill="#38bdf8" font-family="sans-serif" font-size="14" text-anchor="middle" letter-spacing="2">SECURITY ASSESSMENT &amp; VULNERABILITY INTELLIGENCE</text>
</svg>